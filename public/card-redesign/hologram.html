<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100next · Artwork holography</title>
<style>
@font-face{font-family:'Luckiest Guy';src:url('../assets/fonts/LuckiestGuy-Regular.ttf')}
*{box-sizing:border-box}body{margin:0;background:#091320;color:#fff2d2;font:16px/1.5 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:24px}h1{font-size:32px;margin:0 0 8px}p{color:#c9ced7;margin:8px 0 20px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:16px}button,select{font:inherit;padding:9px 15px;background:#152638;color:#fff2d2;border:1px solid #c79b51;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#8b641d}label{display:flex;gap:8px;align-items:center}a{color:#e6bd76}#holograms{width:100%;height:min(60vw,530px)}canvas{display:block}#status{text-align:center;font-size:13px;color:#e6bd76}@media(max-width:700px){main{padding:20px}h1{font-size:26px}#holograms{height:620px}.controls{gap:10px}}
@media(max-width:700px){p{font-size:13px;margin-bottom:14px}.controls{font-size:13px}.controls button,.controls select{padding:8px 10px}#holograms{height:clamp(360px,calc(100svh - 295px),620px)}}
</style>
<main>
<h1>Artwork holography</h1>
<p>Fine metallic glitter flashes with the tilt, without shine lines. Printed suit borders stay fixed; still cards show clean artwork.</p>
<div class="controls">
<button id="tilt" aria-pressed="false">Tilt cards</button><button id="still">Still cards</button>
<label>Artwork <select id="rank"><option value="4">Number 4</option><option value="7">Choose</option><option value="8">Reverse</option><option value="9">Zero</option><option value="10">−10</option></select></label>
<label>Shine <select id="palette"><option value="rainbow">Rainbow glitter</option><option value="suit">Suit glitter</option></select></label>
<a href="./">Full deck</a><a href="../">Play 100next</a>
</div>
<div id="holograms" aria-label="Four suit cards with artwork holography"></div>
<div id="status" role="status">Loading artwork…</div>
</main>
<script src="hologram.js" defer></script>
</html>
