name: Publish 100next
on:
  push:
    branches: [100next]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 100next-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/100next'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fc3687ca0961b51c4e0c0cc05ee4d953
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Check deployment access
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure the CLOUDFLARE_API_TOKEN repository secret to enable automatic publishing.'; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:next
      - run: node scripts/test-midnight-deck.mjs
      - run: pnpm build:next
      - run: pnpm deploy:next
